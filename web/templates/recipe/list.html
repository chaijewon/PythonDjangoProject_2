{% extends "main/main.html" %}
{% block content %}
<div class="wrapper row3">
  <main class="container clear">
    <div class="content">
      <div id="gallery">
        <figure>
          <header class="heading">레시피 목록</header>
          <ul class="nospace clear">
              {% for r in rd %}
                {% if forloop.counter0|divisibleby:4 %}
                  <li class="one_quarter first"><a href="#"><img src="{{r.poster}}" title="{{r.title}}"></a></li>
                {% else %}
                  <li class="one_quarter"><a href="#"><img src="{{r.poster}}" title="{{r.title}}"></a></li>
                {% endif %}
              {% endfor %}
          </ul>
          <figcaption>Gallery Description Goes Here</figcaption>
        </figure>
      </div>
      <nav class="pagination">
        <ul>
          <li><a href="#">&laquo; Previous</a></li>
          <li><a href="#">1</a></li>
          <li><a href="#">2</a></li>

          <li><a href="#">9</a></li>

          <li><a href="#">15</a></li>

        </ul>
      </nav>
      </div>
    <div class="clear"></div>
  </main>
</div>
{% endblock %}
